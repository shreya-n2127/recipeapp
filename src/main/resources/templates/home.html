<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>MealNext</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1><a th:href="@{/}" style="margin:0">MealNext</a></h1>
    <div>
        <div>
            <a th:href="@{/match}">What can I cook?</a>
            <span sec:authorize="isAuthenticated()">
            Hi, <b sec:authentication="name"></b>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left:14px">
                <button type="submit">Logout</button>
            </form>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Login</a> <a th:href="@{/register}">Register</a>
        </span>
    </div>
</header>

<main>
    <h2>What's New</h2>
    <div class="grid">
        <div class="card" th:each="r : ${newRecipes}">
            <span class="badge">NEW</span>
            <h3 th:text="${r.title}">Title</h3>
            <p class="small" th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy')}"></p>
            <a th:href="@{/recipe/{id}(id=${r.id})}">View recipe &rarr;</a>
        </div>
    </div>

    <h2>All Recipes</h2>
    <div class="grid">
        <div class="card" th:each="r : ${recipes}">
            <h3 th:text="${r.title}">Title</h3>
            <p class="small" th:text="${#lists.size(r.ingredients)} + ' ingredients'"></p>
            <a th:href="@{/recipe/{id}(id=${r.id})}">View recipe &rarr;</a>
        </div>
    </div>
</main>
</body>
</html>
