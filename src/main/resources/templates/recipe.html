<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${recipe.title}">Recipe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .video { position: relative; padding-bottom: 56.25%; height: 0; margin: 16px 0; }
        .video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 10px; }
        .chip { display: inline-block; background: #fed7aa; color: #9a3412; padding: 4px 10px; border-radius: 12px; margin: 3px; font-size: 14px; }
        textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { background: #ea580c; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
        .btn.liked { background: #9a3412; }
        .comment { background: white; padding: 10px 14px; border-radius: 8px; margin: 8px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<header>
    <h1><a th:href="@{/}" style="margin:0">Recipe App</a></h1>
    <div>
        <span sec:authorize="isAuthenticated()">
            Hi, <b sec:authentication="name"></b>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left:14px">
                <button type="submit">Logout</button>
            </form>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Login</a> <a th:href="@{/register}">Register</a>
        </span>
    </div>
</header>

<main>
    <a th:href="@{/}">&larr; All recipes</a>
    <h2 th:text="${recipe.title}">Title</h2>

    <div class="video" th:if="${recipe.youtubeId != null and !recipe.youtubeId.isEmpty()}">
        <iframe th:src="'https://www.youtube.com/embed/' + ${recipe.youtubeId}"
                allowfullscreen></iframe>
    </div>
    <p class="small" th:if="${recipe.youtubeId == null or recipe.youtubeId.isEmpty()}">No video for this recipe yet.</p>

    <h3>Ingredients</h3>
    <span class="chip" th:each="i : ${recipe.ingredients}" th:text="${i.name}">Ingredient</span>

    <h3>Method</h3>
    <p th:text="${recipe.instructions}">Steps</p>

    <h3>Likes: <span th:text="${likeCount}">0</span></h3>
    <form sec:authorize="isAuthenticated()" th:action="@{/recipe/{id}/like(id=${recipe.id})}" method="post">
        <button type="submit" class="btn" th:classappend="${liked} ? 'liked'"
                th:text="${liked} ? 'Unlike' : 'Like'">Like</button>
    </form>
    <p sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a> to like this recipe.</p>

    <h3>Comments (<span th:text="${#lists.size(recipe.comments)}">0</span>)</h3>
    <form sec:authorize="isAuthenticated()" th:action="@{/recipe/{id}/comment(id=${recipe.id})}" method="post">
        <textarea name="text" rows="3" maxlength="500" placeholder="Write a comment..." required></textarea>
        <button type="submit" class="btn">Post comment</button>
    </form>
    <p sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a> to comment.</p>

    <div class="comment" th:each="c : ${recipe.comments}">
        <b th:text="${c.user.username}">user</b>
        <span class="small" th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}"></span>
        <p style="margin:6px 0 0" th:text="${c.text}">text</p>
    </div>
</main>
</body>
</html>
